services:
  calendar-frontend:
    build:
      context: ./frontend
      args:
        VITE_BASE: ${CALENDAR_VITE_BASE:-/calendar/}
    networks:
      - app-network
    restart: unless-stopped

  calendar-backend:
    build:
      context: ./backend
    environment:
      - PORT=${CALENDAR_BACKEND_PORT:-8080}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER:-bung}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-bung}
      - DB_NAME=${POSTGRES_DB:-bung}
      - DB_SCHEMA=${CALENDAR_DB_SCHEMA:-calendar}
      - DB_SSLMODE=disable
    networks:
      - app-network
    depends_on:
      postgres:
        condition: service_healthy
      # Invite looks up users by username (cross-schema, see store.go's
      # Invite/ListAttendees).
      app-maintenance-backend:
        condition: service_started
      # Inviting someone notifies them (cross-schema write into
      # notifications.inbox, see notify.go) - that schema must exist first.
      notifications-backend:
        condition: service_started
    restart: unless-stopped
