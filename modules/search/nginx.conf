# Gateway location for the search module.
# Auto-included by /nginx/nginx.conf via `include /etc/nginx/modules/*/nginx.conf;`
#
# Deliberately does NOT set $auth_module_code - same reasoning as
# notifications: search isn't a business module a role grants access to,
# it's a platform-wide utility every logged-in user has (the command
# palette, Ctrl+K, embedded in every other frontend's header). Every
# result is still scoped to what the caller can actually see (see
# search-backend's store.go GrantedModules/per-query ownership checks),
# so the open gateway route never leaks anything a per-module grant would
# have blocked.
#
# No frontend of its own - this is a backend-only module, consumed as an
# overlay embedded in every other module's own frontend (CommandPalette.jsx,
# duplicated the same way NotificationBell.jsx is).

location /search/api/ {
    include /etc/nginx/auth-common.conf;
    error_page 401 = @api_unauthorized;
    error_page 403 = @api_forbidden;
    set $upstream_search_backend search-backend;
    rewrite ^/search/api/(.*)$ /$1 break;
    proxy_pass http://$upstream_search_backend:8080;
}
