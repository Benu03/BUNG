# Gateway location blocks for the notifications module.
# Auto-included by /nginx/nginx.conf via `include /etc/nginx/modules/*/nginx.conf;`
#
# Unlike every other module, these locations deliberately do NOT set
# $auth_module_code - notifications aren't a business module a role grants
# access to, they're a platform utility every logged-in user has
# regardless of which modules they can use (like the bell icon duplicated
# into every other frontend's header). auth-common.conf still requires a
# valid session (via auth_request), it just skips the per-module allow-list
# check when $auth_module_code is empty (see verify() in app-maintenance's
# auth.go).
#
# proxy_pass targets a `set $upstream_x ...;` variable (re-resolved per
# request, see /nginx/nginx.conf), which needs an explicit `rewrite ...
# break;` before it to strip the location's URL prefix - and that `set`
# must come BEFORE the `rewrite ... break;`, not after, or the variable is
# left empty. See the longer comment in /nginx/nginx.conf.

location /notifications/ {
    include /etc/nginx/auth-common.conf;
    error_page 401 403 = @login_redirect;
    set $upstream_notif_frontend notifications-frontend;
    rewrite ^/notifications/(.*)$ /$1 break;
    proxy_pass http://$upstream_notif_frontend:80;
}

location /notifications/api/ {
    include /etc/nginx/auth-common.conf;
    error_page 401 = @api_unauthorized;
    error_page 403 = @api_forbidden;
    set $upstream_notif_backend notifications-backend;
    rewrite ^/notifications/api/(.*)$ /$1 break;
    proxy_pass http://$upstream_notif_backend:8080;
}
