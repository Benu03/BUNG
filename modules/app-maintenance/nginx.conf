# Gateway location blocks for the app-maintenance module.
# Auto-included by /nginx/nginx.conf via `include /etc/nginx/modules/*/nginx.conf;`

# Public: login/logout/me/verify must be reachable without a valid
# session (that's how a session gets created / checked in the first
# place) - so this is deliberately NOT behind auth-common.conf.
location /app-maintenance/api/auth/ {
    proxy_pass http://app-maintenance-backend:8080/auth/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Protected: the app-maintenance UI itself.
location /app-maintenance/ {
    set $auth_module_code "app-maintenance";
    include /etc/nginx/auth-common.conf;
    error_page 401 403 = @login_redirect;
    proxy_pass http://app-maintenance-frontend:80/;
}

# Protected: the app-maintenance API (everything except /auth/, matched
# above - nginx picks the longest matching prefix regardless of order).
location /app-maintenance/api/ {
    set $auth_module_code "app-maintenance";
    include /etc/nginx/auth-common.conf;
    error_page 401 = @api_unauthorized;
    error_page 403 = @api_forbidden;
    proxy_pass http://app-maintenance-backend:8080/;
}
