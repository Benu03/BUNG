# Gateway location blocks for the app-maintenance module.
# Auto-included by /nginx/nginx.conf via `include /etc/nginx/modules/*/nginx.conf;`
#
# Every proxy_pass here targets a `set $upstream_x <service>;` variable
# rather than a bare hostname, so nginx re-resolves it per request (via the
# `resolver` directive in /nginx/nginx.conf) instead of caching whatever IP
# it got at startup. That requires an explicit `rewrite ... break;` right
# before each proxy_pass to strip the location's URL prefix (nginx only
# does that automatically for a *static* proxy_pass URI, not once a
# variable is involved) - and the `set` must come BEFORE that `rewrite
# ... break;`, not after, or the variable is left empty (`break` stops
# rewrite-phase processing right there). See the longer comment in
# /nginx/nginx.conf.

# Public: login/logout/me/verify must be reachable without a valid
# session (that's how a session gets created / checked in the first
# place) - so this is deliberately NOT behind auth-common.conf.
location /app-maintenance/api/auth/ {
    set $upstream_am_backend app-maintenance-backend;
    rewrite ^/app-maintenance/api/auth/(.*)$ /auth/$1 break;
    proxy_pass http://$upstream_am_backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
}

# Public: the portal needs site name/tagline/announcement before a user is
# logged in, to render the login page. Exact match wins over the protected
# /app-maintenance/api/ prefix below regardless of declaration order.
location = /app-maintenance/api/settings/public {
    set $upstream_am_backend app-maintenance-backend;
    rewrite ^ /settings/public break;
    proxy_pass http://$upstream_am_backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
}

# Protected: the app-maintenance UI itself.
location /app-maintenance/ {
    set $auth_module_code "app-maintenance";
    include /etc/nginx/auth-common.conf;
    error_page 401 403 = @login_redirect;
    set $upstream_am_frontend app-maintenance-frontend;
    rewrite ^/app-maintenance/(.*)$ /$1 break;
    proxy_pass http://$upstream_am_frontend:80;
}

# Protected: the app-maintenance API (everything except /auth/, matched
# above - nginx picks the longest matching prefix regardless of order).
location /app-maintenance/api/ {
    set $auth_module_code "app-maintenance";
    include /etc/nginx/auth-common.conf;
    error_page 401 = @api_unauthorized;
    error_page 403 = @api_forbidden;
    set $upstream_am_backend app-maintenance-backend;
    rewrite ^/app-maintenance/api/(.*)$ /$1 break;
    proxy_pass http://$upstream_am_backend:8080;
}
