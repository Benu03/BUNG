services:
  app-maintenance-frontend:
    build:
      context: ./frontend
      args:
        VITE_BASE: ${APP_MAINTENANCE_VITE_BASE:-/app-maintenance/}
    networks:
      - app-network
    restart: unless-stopped

  app-maintenance-backend:
    build:
      context: ./backend
    environment:
      - PORT=${APP_MAINTENANCE_BACKEND_PORT:-8080}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER:-bung}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-bung}
      - DB_NAME=${POSTGRES_DB:-bung}
      - DB_SCHEMA=${APP_MAINTENANCE_DB_SCHEMA:-app_maintenance}
      - DB_SSLMODE=disable
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET in .env}
      - AUTH_TOKEN_TTL_HOURS=${AUTH_TOKEN_TTL_HOURS:-12}
    networks:
      - app-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
