services:
  app-maintenance-frontend:
    build:
      context: ./frontend
      args:
        VITE_BASE: ${APP_MAINTENANCE_VITE_BASE:-/app-maintenance/}
    networks:
      - app-network
    restart: unless-stopped

  app-maintenance-backend:
    build:
      context: ./backend
    environment:
      - PORT=${APP_MAINTENANCE_BACKEND_PORT:-8080}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER:-bung}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-bung}
      - DB_NAME=${POSTGRES_DB:-bung}
      - DB_SCHEMA=${APP_MAINTENANCE_DB_SCHEMA:-app_maintenance}
      - DB_SSLMODE=disable
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET in .env}
      - AUTH_TOKEN_TTL_HOURS=${AUTH_TOKEN_TTL_HOURS:-12}
      - SEED_ADMIN_PASSWORD=${SEED_ADMIN_PASSWORD:-admin123}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-http://localhost:8080}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-no-reply@bung.local}
    networks:
      - app-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
