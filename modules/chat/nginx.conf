# Gateway location blocks for the chat module.
# Auto-included by /nginx/nginx.conf via `include /etc/nginx/modules/*/nginx.conf;`
#
# Gated by `$auth_module_code "chat"` like any other real module (kanban,
# calendar, ticketing) - NOT left open like notifications/search. Earlier
# this was left open on the theory that a small team should have chat by
# default, but that meant it could never appear as a portal tile (the
# portal only lists modules baked into the caller's JWT via a role grant -
# see app-maintenance's UserModules query) and admins had no way to
# revoke/toggle access. Chat is a real destination users navigate to, not
# a cross-cutting utility like the notification bell - it belongs in the
# module/role system like everything else. The one exception is the
# broadcast-to-everyone endpoint, which layers an *additional*,
# independent check on top (app-maintenance admin, not just "has chat") -
# see handlers.go's createBroadcast.
#
# proxy_pass targets a `set $upstream_x ...;` variable (re-resolved per
# request, see /nginx/nginx.conf), which needs an explicit `rewrite ...
# break;` before it to strip the location's URL prefix - and that `set`
# must come BEFORE the `rewrite ... break;`, not after, or the variable is
# left empty. See the longer comment in /nginx/nginx.conf.

location /chat/ {
    set $auth_module_code "chat";
    include /etc/nginx/auth-common.conf;
    error_page 401 403 = @login_redirect;
    set $upstream_chat_frontend chat-frontend;
    rewrite ^/chat/(.*)$ /$1 break;
    proxy_pass http://$upstream_chat_frontend:80;
}

# Real-time delivery (see hub.go). A regex location, so it wins over the
# plain-prefix /chat/api/ block below regardless of file order (same
# nginx precedence note as kanban's WS location) - needs its own Upgrade/
# Connection headers and long timeouts for the WebSocket handshake/
# long-lived connection to survive.
location ~ ^/chat/api/ws$ {
    set $auth_module_code "chat";
    include /etc/nginx/auth-common.conf;
    error_page 401 = @api_unauthorized;
    error_page 403 = @api_forbidden;
    set $upstream_chat_backend chat-backend;
    rewrite ^/chat/api/(.*)$ /$1 break;
    proxy_pass http://$upstream_chat_backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

location /chat/api/ {
    set $auth_module_code "chat";
    include /etc/nginx/auth-common.conf;
    error_page 401 = @api_unauthorized;
    error_page 403 = @api_forbidden;
    set $upstream_chat_backend chat-backend;
    rewrite ^/chat/api/(.*)$ /$1 break;
    proxy_pass http://$upstream_chat_backend:8080;
}
