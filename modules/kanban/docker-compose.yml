services:
  kanban-frontend:
    build:
      context: ./frontend
      args:
        VITE_BASE: ${KANBAN_VITE_BASE:-/kanban/}
    networks:
      - app-network
    restart: unless-stopped

  kanban-backend:
    build:
      context: ./backend
    environment:
      - PORT=${KANBAN_BACKEND_PORT:-8080}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER:-bung}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-bung}
      - DB_NAME=${POSTGRES_DB:-bung}
      - DB_SCHEMA=${KANBAN_DB_SCHEMA:-kanban}
      - DB_SSLMODE=disable
    networks:
      - app-network
    depends_on:
      postgres:
        condition: service_healthy
      # Kanban reads app_maintenance.users directly (cross-schema, see
      # store.go's ListAllUsers) and seeds its starter board owned by the
      # admin user - starting after app-maintenance reduces, though doesn't
      # fully eliminate, the race on a very first `docker compose up`.
      app-maintenance-backend:
        condition: service_started
      # Adding a board member notifies them (cross-schema write into
      # notifications.inbox, see notify.go) - that schema must exist first.
      notifications-backend:
        condition: service_started
    restart: unless-stopped
