# Gateway location blocks for the kanban module.
# Auto-included by /nginx/nginx.conf via `include /etc/nginx/modules/*/nginx.conf;`
# Auth is fully centralized at the gateway (see /nginx/auth-common.conf) -
# this module's own backend has no auth code of its own.
#
# proxy_pass targets a `set $upstream_x ...;` variable (re-resolved per
# request, see /nginx/nginx.conf), which needs an explicit `rewrite ...
# break;` before it to strip the location's URL prefix - and that `set`
# must come BEFORE the `rewrite ... break;`, not after, or the variable is
# left empty. See the longer comment in /nginx/nginx.conf.

location /kanban/ {
    set $auth_module_code "kanban";
    include /etc/nginx/auth-common.conf;
    error_page 401 403 = @login_redirect;
    set $upstream_kanban_frontend kanban-frontend;
    rewrite ^/kanban/(.*)$ /$1 break;
    proxy_pass http://$upstream_kanban_frontend:80;
}

location /kanban/api/ {
    set $auth_module_code "kanban";
    include /etc/nginx/auth-common.conf;
    error_page 401 = @api_unauthorized;
    error_page 403 = @api_forbidden;
    set $upstream_kanban_backend kanban-backend;
    rewrite ^/kanban/api/(.*)$ /$1 break;
    proxy_pass http://$upstream_kanban_backend:8080;
}

# Real-time board updates (see hub.go). A regex location, so it wins over
# the plain-prefix /kanban/api/ block above regardless of file order
# (nginx checks all `location ~` regex blocks, in the order they appear,
# after finding the longest non-^~ prefix match - the first matching
# regex still overrides that prefix match). Needs its own Upgrade/
# Connection headers and long timeouts for the WebSocket handshake/
# long-lived connection to survive - the plain block above doesn't set
# those since ordinary HTTP requests don't need them.
location ~ ^/kanban/api/boards/[^/]+/ws$ {
    set $auth_module_code "kanban";
    include /etc/nginx/auth-common.conf;
    error_page 401 = @api_unauthorized;
    error_page 403 = @api_forbidden;
    set $upstream_kanban_backend kanban-backend;
    rewrite ^/kanban/api/(.*)$ /$1 break;
    proxy_pass http://$upstream_kanban_backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
