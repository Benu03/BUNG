# Gateway location for the logs module (live container log viewer, shown
# as a new "Logs" tab inside App Maintenance's own frontend).
#
# Deliberately gated by app-maintenance's own module grant
# ($auth_module_code "app-maintenance") rather than a new grantable "logs"
# module - this is a sub-feature of App Maintenance, not something a role
# is assigned to separately. Raw container logs can contain secrets/stack
# traces, so it stays tied to the same admin-tier access as Users/Roles/
# Audit Log.
#
# SSE (Server-Sent Events) needs `proxy_buffering off` and long timeouts -
# nginx's default response buffering would hold back every chunk until
# the buffer fills or the stream ends, defeating the whole point of a
# *live* log stream.

location /logs/api/ {
    set $auth_module_code "app-maintenance";
    include /etc/nginx/auth-common.conf;
    error_page 401 = @api_unauthorized;
    error_page 403 = @api_forbidden;
    set $upstream_logs_backend logs-backend;
    rewrite ^/logs/api/(.*)$ /$1 break;
    proxy_pass http://$upstream_logs_backend:8080;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    chunked_transfer_encoding off;
}
