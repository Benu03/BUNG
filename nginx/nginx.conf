worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 20m;

    # Trust Cloudflare / any upstream proxy for forwarded headers.
    # (Tighten set_real_ip_from once you know Cloudflare's IP ranges,
    # see https://www.cloudflare.com/ips/)
    map $http_x_forwarded_proto $forwarded_scheme {
        default $scheme;
        https   https;
    }

    server {
        listen 80;
        server_name _;

        # Landing page: shows a login form or the module grid depending on
        # session state (checked client-side via /app-maintenance/api/auth/me).
        # Deliberately public at the nginx level - it IS the login page.
        location / {
            proxy_pass http://portal-frontend:80/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Internal-only target for the `auth_request` directive used by
        # every protected location (see /nginx/auth-common.conf). Not
        # reachable directly by clients ("internal").
        location = /_auth/verify {
            internal;
            proxy_pass http://app-maintenance-backend:8080/auth/verify;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Module-Code $auth_module_code;
            proxy_set_header Cookie $http_cookie;
        }

        # Shared fallbacks a protected location's `error_page` points at.
        location @login_redirect {
            return 302 /?login_required=1;
        }
        location @api_unauthorized {
            default_type application/json;
            return 401 '{"error":"unauthorized"}';
        }
        location @api_forbidden {
            default_type application/json;
            return 403 '{"error":"forbidden"}';
        }

        # Each module contributes its own location blocks from
        # /modules/<name>/nginx.conf, mounted read-only into this
        # container at /etc/nginx/modules/. Adding a new module folder
        # is picked up automatically on container (re)start/reload -
        # no changes needed to this file.
        include /etc/nginx/modules/*/nginx.conf;
    }
}
