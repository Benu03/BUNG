worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 20m;

    # Docker's embedded DNS. Using it with a short TTL - and a variable in
    # every proxy_pass below, instead of a bare hostname - makes nginx
    # re-resolve each upstream per request rather than caching whatever IP
    # it got at startup. Without this, restarting/rebuilding a module's
    # container (which gets a new IP) silently leaves the gateway pointing
    # at whatever container now happens to hold the OLD IP, until nginx
    # itself is restarted - a confusing "wrong page loads" bug.
    #
    # GOTCHA #1: once proxy_pass contains a variable, nginx stops doing its
    # automatic "replace the matched location prefix with proxy_pass's URI"
    # rewrite - it passes the ORIGINAL request URI through unchanged
    # instead. Every location below that used to rely on that (e.g.
    # /app-maintenance/api/auth/login -> /auth/login) now does its own
    # `rewrite ... break;` immediately before proxy_pass to strip the
    # prefix explicitly.
    # GOTCHA #2: `rewrite ... break;` stops rewrite-phase directive
    # processing for that request right there - a `set $upstream_x ...;`
    # written AFTER it in the same location never runs (empty variable ->
    # "no host in upstream" from nginx). Always `set` the upstream variable
    # BEFORE the `rewrite ... break;` line, not after.
    resolver 127.0.0.11 valid=10s;

    # Trust Cloudflare / any upstream proxy for forwarded headers.
    # (Tighten set_real_ip_from once you know Cloudflare's IP ranges,
    # see https://www.cloudflare.com/ips/)
    map $http_x_forwarded_proto $forwarded_scheme {
        default $scheme;
        https   https;
    }

    server {
        listen 80;
        server_name _;

        # Landing page: shows a login form or the module grid depending on
        # session state (checked client-side via /app-maintenance/api/auth/me).
        # Deliberately public at the nginx level - it IS the login page.
        # No rewrite needed: portal-frontend's own base is "/", so the
        # unmodified request URI is already what it expects.
        location / {
            set $upstream_portal portal-frontend;
            proxy_pass http://$upstream_portal:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Internal-only target for the `auth_request` directive used by
        # every protected location (see /nginx/auth-common.conf). Not
        # reachable directly by clients ("internal").
        location = /_auth/verify {
            internal;
            set $upstream_auth app-maintenance-backend;
            rewrite ^ /auth/verify break;
            proxy_pass http://$upstream_auth:8080;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Module-Code $auth_module_code;
            proxy_set_header Cookie $http_cookie;
        }

        # Shared fallbacks a protected location's `error_page` points at.
        location @login_redirect {
            return 302 /?login_required=1;
        }
        location @api_unauthorized {
            default_type application/json;
            return 401 '{"error":"unauthorized"}';
        }
        location @api_forbidden {
            default_type application/json;
            return 403 '{"error":"forbidden"}';
        }

        # Each module contributes its own location blocks from
        # /modules/<name>/nginx.conf, mounted read-only into this
        # container at /etc/nginx/modules/. Adding a new module folder
        # is picked up automatically on container (re)start/reload -
        # no changes needed to this file. Each one should use the same
        # `set $upstream_x name; rewrite ...; proxy_pass http://$upstream_x:port;`
        # pattern above rather than a bare hostname, for the same reason.
        include /etc/nginx/modules/*/nginx.conf;
    }
}
