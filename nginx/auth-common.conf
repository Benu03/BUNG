# Shared auth snippet, included from every protected location block (both
# module frontends and module APIs). The calling location must `set
# $auth_module_code "<code>";` before including this.
#
# Delegates to app-maintenance's /auth/verify via the internal /_auth/verify
# location (see nginx.conf) - it only checks the session JWT's signature,
# expiry, and (via X-Module-Code) whether the token's baked-in module list
# includes this module. No database call per request.

auth_request /_auth/verify;
auth_request_set $auth_user_id $upstream_http_x_user_id;
auth_request_set $auth_username $upstream_http_x_username;

proxy_set_header X-User-Id $auth_user_id;
proxy_set_header X-Username $auth_username;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
# $request_id is nginx's own built-in per-request unique id (core, no
# module needed) - forwarding it lets every backend's logs and audit
# trail entries be correlated back to one specific request/nginx access
# log line. Echoed back to the client too (see the `add_header` in
# nginx.conf's server block) so a user reporting an error can hand over
# this id.
proxy_set_header X-Request-Id $request_id;
